[project]
name = "housing-tinder-scraper"
version = "0.1.0"
description = "Scrapes Danish housing sites (sale, rent, andelsbolig) into static JSON for the Housing Tinder PWA"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
]

[project.scripts]
scrape = "scraper.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
